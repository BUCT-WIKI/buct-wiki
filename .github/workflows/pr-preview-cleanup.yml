name: PR preview cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview cleanup mode
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'BUCT-WIKI/buct-wiki' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - run: pnpm install --dev --frozen-lockfile --ignore-scripts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLEANUP_MODE: ${{ inputs.mode }}
        with:
          script: |
            const { cleanup } = require('./scripts/preview-cleanup.cjs');
            await cleanup({
              github, context, core,
              dryRun: context.eventName !== 'schedule' && process.env.CLEANUP_MODE !== 'apply',
            });
