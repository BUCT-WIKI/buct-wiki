name: Content PR preview build

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: content-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only trusted template code is checked out. Content is fetched separately at the event SHA.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: BUCT-WIKI/buct-wiki
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:cloudflare --mode preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTENT_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CONTENT_GIT_REF: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-preview
          path: dist/
          if-no-files-found: error
          retention-days: 3
